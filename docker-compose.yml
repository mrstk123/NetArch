services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Override the password by exporting MSSQL_SA_PASSWORD before running compose
      ConnectionStrings__DefaultConnection: "Server=db;Database=NetArch.Template;User Id=sa;Password=${MSSQL_SA_PASSWORD:-<YourStrong!Passw0rd>};TrustServerCertificate=True;"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-<YourStrong!Passw0rd>}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  sqldata:
