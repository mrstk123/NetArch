name: Validate Template and Release NuGet on Main Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  # Generate and build every architecture x ORM variant so conditional
  # template code paths are actually compiled before a release ships.
  validate-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [Clean, NTier]
        orm: [EFCore, Dapper, Hybrid]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install template from source
        run: dotnet new install $GITHUB_WORKSPACE

      - name: Scaffold project (${{ matrix.architecture }} / ${{ matrix.orm }})
        run: dotnet new net-arch -n MatrixApp -o "$RUNNER_TEMP/matrix" --architecture ${{ matrix.architecture }} --orm ${{ matrix.orm }}

      - name: Build scaffolded solution
        run: dotnet build "$RUNNER_TEMP/matrix/MatrixApp.sln" -c Release

      - name: Run scaffolded tests
        run: dotnet test "$RUNNER_TEMP/matrix/MatrixApp.sln" -c Release --no-build

  validate-angular:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install template from source
        run: dotnet new install $GITHUB_WORKSPACE

      - name: Scaffold Angular project
        run: dotnet new net-arch -n AngularApp -o "$RUNNER_TEMP/angular" --ui angular

      # Release build skips npm targets (DebugEnsureNodeEnv is Debug-only),
      # this validates the WebAPI project compiles with SPA wiring enabled.
      - name: Build scaffolded solution
        run: dotnet build "$RUNNER_TEMP/angular/AngularApp.sln" -c Release

  release:
    needs: [validate-matrix, validate-angular]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Generate both a Tag Name and a strict NuGet Version
      - name: Generate Version Numbers
        id: version_generator
        run: |
          DATE_VERSION="$(date +'%Y.%m.%d').${{ github.run_number }}"
          echo "NUGET_VERSION=$DATE_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$DATE_VERSION" >> $GITHUB_ENV

      # Pack ONLY the template csproj — a bare `dotnet pack` would resolve to the
      # solution and publish every layer project as an unwanted NuGet package.
      # /p:Version overrides the version inside your .csproj file with our new date version
      - name: Pack NuGet Package
        run: dotnet pack NetArch.Template.csproj --configuration Release /p:Version=${{ env.NUGET_VERSION }} --output ./nupkg-artifacts

      # Create the Release AND upload the generated .nupkg file to it
      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: "Automated NuGet package release generated from the main branch."
          draft: false
          prerelease: false
          files: ./nupkg-artifacts/*.nupkg
